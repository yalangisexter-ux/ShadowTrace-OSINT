name = "shadowtrace-osint"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "shadowtrace-db"
database_id = "1027994b-68fa-488e-8ab5-249f8c0d74a6"
migrations_dir = "migrations"

[vars]
APP_ENV = "production"
ACCESS_TOKEN_MINUTES = "60"
# SECRET_KEY must be set via: npx wrangler secret put SECRET_KEY
# Never commit production secrets.
