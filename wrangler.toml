name = "shadowtrace-osint"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./frontend"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "shadowtrace-db"
database_id = "local-shadowtrace-db"
migrations_dir = "migrations"

[vars]
APP_ENV = "production"
ACCESS_TOKEN_MINUTES = "60"
