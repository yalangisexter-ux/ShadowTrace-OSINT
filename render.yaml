services:
  - type: web
    name: shadowtrace-osint
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      # REQUIRED — set these manually in the Render dashboard after the service is created:
      #   DATABASE_URL = Internal connection string of your PostgreSQL instance
      #   SECRET_KEY   = long random string (>= 32 characters)
      # Generate SECRET_KEY with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
