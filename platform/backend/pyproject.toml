[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadowtrace-platform"
version = "0.1.0"
description = "Modular, evidence-first OSINT platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "dnspython>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.18,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
database = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2"]
queue = ["celery[redis]>=5.4,<6", "redis>=5,<6"]
reports = ["reportlab>=4.2,<5", "python-docx>=1.1,<2", "markdown>=3.7,<4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
