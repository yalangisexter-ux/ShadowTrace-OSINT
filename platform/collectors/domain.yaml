name: domain.passive
version: "0.1.0"
description: Passive DNS and Certificate Transparency collection
entity_types:
  - domain
  - hostname
  - dns_record
sources:
  - system_dns_resolver
  - crt.sh
limits:
  timeout_seconds: 8
  max_ct_names: 500
notes:
  - Passive only. No port scanning, brute force, or authenticated access.
